<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="ap-title ap-desc">
<title id="ap-title">AdsPower Proxy Profile</title>
<desc id="ap-desc">Illustration of a proxy card with HTTP, HTTPS and SOCKS5 schemes and a masked password, a cable carrying traffic to a browser window profile, and two separate steps: a create-profile preview, then an explicit launch button that needs authorization. It makes no anonymity or access-bypass claim.</desc>
<style>
.ap-s{font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif}
.ap-m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
.ap-pk{animation:ap-pk 3.2s ease-in-out infinite}
@keyframes ap-pk{0%{transform:translateX(0);opacity:0}8%{transform:translateX(0);opacity:1}60%{transform:translateX(98px);opacity:1}68%{transform:translateX(98px);opacity:0}100%{transform:translateX(0);opacity:0}}
.ap-pk2{animation-delay:-1.6s}
.ap-ring{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:ap-ring 3.2s ease-out infinite}
@keyframes ap-ring{0%,58%{transform:scale(1);opacity:0}60%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.ap-ring2{animation-delay:-1.6s}
.ap-dash{stroke-dasharray:10 90;animation:ap-dash 3.2s linear infinite}
@keyframes ap-dash{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.ap-dot{animation:ap-dot 2.4s ease-in-out infinite}
.ap-d2{animation-delay:.15s}.ap-d3{animation-delay:.3s}.ap-d4{animation-delay:.45s}.ap-d5{animation-delay:.6s}.ap-d6{animation-delay:.75s}.ap-d7{animation-delay:.9s}.ap-d8{animation-delay:1.05s}
@keyframes ap-dot{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="500" fill="#E0F8F5"/>
<rect x="0" y="0" width="1000" height="10" fill="#FFC21A"/>

<!-- header -->
<text class="ap-s" x="36" y="70" font-size="46" font-weight="800" fill="#161B4D" letter-spacing="-1">AdsPower <tspan fill="#E5392B">Proxy</tspan> Profile</text>
<text class="ap-s" x="36" y="102" font-size="18" font-weight="600" fill="#161B4D">Prepare a proxy-backed browser profile without leaking its password.</text>
<rect x="664" y="34" width="300" height="30" rx="15" fill="#161B4D"/>
<text class="ap-s" x="814" y="54" font-size="13" font-weight="800" fill="#FFC21A" text-anchor="middle" letter-spacing=".4">ILLUSTRATIVE / SYNTHETIC DATA</text>

<!-- proxy card -->
<rect x="42" y="146" width="220" height="196" rx="22" fill="#161B4D"/>
<rect x="36" y="140" width="220" height="196" rx="22" fill="#FFE14D"/>
<text class="ap-s" x="52" y="166" font-size="14" font-weight="800" fill="#161B4D" letter-spacing="2">PROXY</text>
<g class="ap-s" font-size="14" font-weight="800" fill="#161B4D" text-anchor="middle">
<rect x="52" y="178" width="52" height="26" rx="13" fill="#fff"/><text x="78" y="196">HTTP</text>
<rect x="110" y="178" width="60" height="26" rx="13" fill="#fff"/><text x="140" y="196">HTTPS</text>
<rect x="176" y="178" width="68" height="26" rx="13" fill="#fff"/><text x="210" y="196">SOCKS5</text>
</g>
<rect x="52" y="214" width="192" height="34" rx="10" fill="#fff"/>
<text class="ap-m" x="64" y="236" font-size="14" font-weight="700" fill="#161B4D">proxy.example:1080</text>
<rect x="52" y="256" width="192" height="34" rx="10" fill="#fff"/>
<text class="ap-s" x="64" y="278" font-size="14" font-weight="800" fill="#161B4D">pass</text>
<g fill="#D62F22"><circle class="ap-dot" cx="112" cy="273" r="4.5"/><circle class="ap-dot ap-d2" cx="126" cy="273" r="4.5"/><circle class="ap-dot ap-d3" cx="140" cy="273" r="4.5"/><circle class="ap-dot ap-d4" cx="154" cy="273" r="4.5"/><circle class="ap-dot ap-d5" cx="168" cy="273" r="4.5"/><circle class="ap-dot ap-d6" cx="182" cy="273" r="4.5"/><circle class="ap-dot ap-d7" cx="196" cy="273" r="4.5"/><circle class="ap-dot ap-d8" cx="210" cy="273" r="4.5"/></g>
<text class="ap-s" x="52" y="316" font-size="14" font-weight="800" fill="#161B4D">Masked in all output</text>

<!-- browser window -->
<rect x="352" y="146" width="612" height="196" rx="20" fill="#161B4D"/>
<rect x="346" y="140" width="612" height="196" rx="20" fill="#fff"/>
<path d="M366 140 H938 Q958 140 958 160 V172 H346 V160 Q346 140 366 140 Z" fill="#2B4BFF"/>
<g fill="#FFC21A"><circle cx="366" cy="156" r="5"/></g><circle cx="382" cy="156" r="5" fill="#D62F22"/><circle cx="398" cy="156" r="5" fill="#00D1BF"/>
<rect x="418" y="146" width="168" height="26" rx="10" fill="#fff"/>
<circle cx="436" cy="159" r="5" fill="#00D1BF"/>
<text class="ap-s" x="448" y="165" font-size="14" font-weight="800" fill="#161B4D">demo-profile</text>
<!-- cable -->
<line x1="256" y1="195" x2="370" y2="195" stroke="#161B4D" stroke-width="14" stroke-linecap="round"/>
<line x1="256" y1="195" x2="370" y2="195" stroke="#FFC21A" stroke-width="7" stroke-linecap="round"/>
<path class="ap-dash" pathLength="100" d="M256 195 H370" fill="none" stroke="#2B4BFF" stroke-width="5" stroke-linecap="round"/>
<g class="ap-pk"><circle cx="270" cy="195" r="9" fill="#FF4B3E" stroke="#161B4D" stroke-width="3"/></g>
<g class="ap-pk ap-pk2"><circle cx="270" cy="195" r="9" fill="#FF4B3E" stroke="#161B4D" stroke-width="3"/></g>

<rect x="362" y="180" width="580" height="30" rx="15" fill="#EEF1FF"/>
<rect x="366" y="183" width="84" height="24" rx="12" fill="#FFC21A"/>
<text class="ap-s" x="408" y="200" font-size="13" font-weight="800" fill="#161B4D" text-anchor="middle">via proxy</text>
<circle class="ap-ring" cx="372" cy="195" r="9" fill="none" stroke="#FF4B3E" stroke-width="3"/>
<circle class="ap-ring ap-ring2" cx="372" cy="195" r="9" fill="none" stroke="#FF4B3E" stroke-width="3"/>
<text class="ap-m" x="462" y="200" font-size="14" font-weight="700" fill="#161B4D">https://app.example.test</text>

<!-- page content -->
<rect x="362" y="226" width="56" height="8" rx="4" fill="#FF4B3E"/>
<g class="ap-s" fill="#161B4D">
<text x="362" y="256" font-size="16" font-weight="800">This profile's traffic is</text>
<text x="362" y="278" font-size="16" font-weight="800">configured to use your proxy.</text>
<text x="362" y="308" font-size="15" font-weight="700" fill="#D1281A">No anonymity or bypass guarantee.</text>
</g>
<!-- inspector -->
<rect x="684" y="222" width="258" height="100" rx="14" fill="#E0F8F5"/>
<g class="ap-s" font-size="14" fill="#161B4D">
<text x="698" y="244" font-weight="800">name</text><text x="790" y="244" font-weight="700" class="ap-m">demo-profile</text>
<text x="698" y="266" font-weight="800">proxy</text><text x="790" y="266" font-weight="700" class="ap-m">socks5 host:port</text>
<text x="698" y="288" font-weight="800">password</text>
<text x="698" y="310" font-weight="800">fingerprint</text><text x="790" y="310" font-weight="700">minimal</text>
</g>
<g fill="#D62F22"><rect x="790" y="280" width="9" height="9" rx="4.5"/><rect x="804" y="280" width="9" height="9" rx="4.5"/><rect x="818" y="280" width="9" height="9" rx="4.5"/><rect x="832" y="280" width="9" height="9" rx="4.5"/><rect x="846" y="280" width="9" height="9" rx="4.5"/><rect x="860" y="280" width="9" height="9" rx="4.5"/></g>
<rect x="882" y="276" width="52" height="18" rx="9" fill="#161B4D"/><text class="ap-s" x="908" y="289" font-size="13" font-weight="800" fill="#FFC21A" text-anchor="middle">hidden</text>

<!-- step 1: create preview -->
<rect x="42" y="372" width="444" height="104" rx="20" fill="#D62F22"/>
<rect x="36" y="366" width="444" height="104" rx="20" fill="#fff" stroke="#D62F22" stroke-width="3.5" stroke-dasharray="11 7"/>
<rect x="52" y="378" width="190" height="26" rx="13" fill="#D62F22"/>
<text class="ap-s" x="147" y="396" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="1">1 · CREATE PREVIEW</text>
<text class="ap-m" x="52" y="430" font-size="15" font-weight="800" fill="#161B4D">create --name demo-profile</text>
<text class="ap-s" x="52" y="454" font-size="14" font-weight="700" fill="#161B4D">--execute creates the profile only.</text>
<rect x="392" y="380" width="72" height="52" rx="10" fill="none" stroke="#D62F22" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="392" y="380" width="72" height="14" rx="7" fill="#D62F22" fill-opacity=".35"/>
<text class="ap-s" x="428" y="418" font-size="13" font-weight="800" fill="#C2271B" text-anchor="middle">draft</text>
<text class="ap-s" x="428" y="454" font-size="13" font-weight="700" fill="#161B4D" text-anchor="middle">no browser</text>

<!-- then -->
<path d="M486 418 h28 m-10 -11 l11 11 -11 11" fill="none" stroke="#161B4D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

<!-- step 2: launch -->
<rect x="526" y="372" width="438" height="104" rx="20" fill="#161B4D"/>
<rect x="520" y="366" width="438" height="104" rx="20" fill="#2B4BFF"/>
<rect x="536" y="378" width="206" height="26" rx="13" fill="#FFC21A"/>
<text class="ap-s" x="639" y="396" font-size="14" font-weight="800" fill="#161B4D" text-anchor="middle" letter-spacing="1">2 · EXPLICIT LAUNCH</text>
<rect x="536" y="418" width="190" height="42" rx="21" fill="#D62F22" stroke="#fff" stroke-width="3"/>
<path d="M562 428 l16 11 -16 11 z" fill="#fff"/>
<text class="ap-s" x="590" y="445" font-size="17" font-weight="800" fill="#fff">Start browser</text>
<g class="ap-s" fill="#fff" font-size="14" font-weight="700">
<text x="744" y="432">Separate step: needs</text>
<text x="744" y="452">authorization + --execute</text>
</g>
<text class="ap-s" x="946" y="396" font-size="13" font-weight="800" fill="#E0F8F5" text-anchor="end">Local API: loopback only</text>
</svg>
